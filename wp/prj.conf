CONFIG_GPIO=y

CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

CONFIG_ESB=y
CONFIG_ESB_CLOCK_INIT=y

# Factory device ID, used as the programmer's ID towards the tag.
CONFIG_HWINFO=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Off by default on Nordic SoCs, needed to switch to the baud rate agreed with the PC.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# Tag messages are streamed to the PC with fifo_fill, a larger buffer means fewer idle gaps between DMA transfers.
CONFIG_UART_20_NRF_TX_BUFFER_SIZE=256
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

CONFIG_MAIN_STACK_SIZE=4096

# Must match the other device (dk_tag_emulator, NMini configs/prj_hw.conf), and fit PICOFIX_MAX_PACKET.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=252
CONFIG_ESB_TX_FIFO_SIZE=2
CONFIG_ESB_RX_FIFO_SIZE=2
CONFIG_ESB_PIPE_COUNT=1
