# MCUboot for the wireless programmer, merged on top of MCUboot's own configuration.

# Serial recovery over the PC UART (uart20, see ../uart_pc.dtsi). There's no button, so after every reset MCUboot waits
# for an SMP command before starting the app. The time from power-on until the PC can send one was measured as well
# under 1 s on the bench; 3 s leaves margin for slower PCs and a board that starts sooner.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=3000
# Stays in recovery when there's no valid app, such as after an interrupted upload
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# Lets a tool check it's talking to MCUboot
CONFIG_BOOT_MGMT_ECHO=y

# The recovery UART is the PC link, so nothing else may write to it
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_NCS_BOOT_BANNER=n

# Write-locks MCUboot's partition until reset before starting the app, so the app can't overwrite the bootloader
CONFIG_FPROTECT=y

# Preserve the GRTC counter across the MCUboot-to-application handoff, so the app's uptime counts from MCUboot's start
CONFIG_COMPILER_OPT="-DNRFX_GRTC_CONFIG_STOP_AT_UNINIT=0 -DNRFX_GRTC_CONFIG_CLEAR_AT_UNINIT=0"
