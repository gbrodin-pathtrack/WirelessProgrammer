# MCUboot with serial recovery over the PC UART, so the WP can be reprogrammed without a debugger. The app is kept in a
# single slot and replaced directly by a recovery upload: recovery is always reachable at power-on, so a bad image
# can always be replaced and there's nothing to revert to.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# The board's devicetree partitions are used, with MCUboot in the first 62 KiB so FPROTECT can lock it
SB_CONFIG_PARTITION_MANAGER=n
SB_CONFIG_MERGED_HEX_FILES=y

# The WP's own keys, so images for other products can't be loaded onto it, or WP images onto them
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/cert/signing_key_wp.pem"

# Recovery uploads are encrypted, and MCUboot decrypts them in place once the upload is complete. The image stored on
# the WP, and the merged hex programmed over SWD, are not encrypted.
SB_CONFIG_BOOT_ENCRYPTION=y
SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="${APP_DIR}/cert/encryption_key_wp.pem"
